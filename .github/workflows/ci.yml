name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq tmux

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck tmux jq

      - name: Versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n 2p
          tmux -V
          jq --version

      - name: shellcheck, fake-terminal suites, real-tmux smoke
        run: bash tests/run.sh
